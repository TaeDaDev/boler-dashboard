<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Interactive Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/metric-converter.js"></script>

    <!-- Bootstrap  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1>My Interactive Dashboard</h1>
    <p>
      This dashboard was created by Asante Boler for the WEB-115 course at Wake
      Tech
    </p>

    <script>
      document.write(
        "This dashboard demonstrates how JavaScript can be used to create interactive websites.",
      );
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript
      >Unfortunately, your web browser does not support JavaScript.</noscript
    >

    <div class="container">
      <div class="row">
        <!-- Dashboard Content -->
        <div class="col" id="metric-converter">
          <h2>Imperial/Metric Converter</h2>

          <form>
            <label for="numeric-value">Enter a value:</label>
            <input type="number" id="numeric-value" required />

            <label for="conversion-type">Choose a conversion:</label>
            <select id="conversion-type">
              <option value="inch-to-centimeter">Inches to Centimeters</option>
              <option value="foot-to-meter">Feet to Meters</option>
              <option value="yard-to-meter">Yards to Meters</option>
              <option value="mile-to-kilometer">Miles to Kilometers</option>
              <option value="centimeter-to-inch">Centimeters to Inches</option>
              <option value="meter-to-foot">Meters to Feet</option>
              <option value="meter-to-yard">Meters to Yards</option>
              <option value="kilometer-to-mile">Kilometers to Miles</option>
            </select>

            <button type="submit" id="convert-button">Convert</button>
          </form>

          <div id="conversion-result"></div>

          <script src="metric-converter.js" defer></script>
        </div>
      </div>
    </div>
  </body>
</html>
