<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>

    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>
        This dashboard was created by Asante Boler for the WEB-115 course at Wake Tech
    </p>

    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
        <h2>Metric Converter</h2>

    <input id="number" type="number" placeholder="Enter a number">

    <select id="conversion">
        <option value="inch">Inch to Centimeter</option>
        <option value="foot">Foot to Centimeter</option>
        <option value="yard">Yard to Meter</option>
        <option value="mile">Mile to Kilometer</option>
        <option value="cm-inch">Centimeter to Inch</option>
        <option value="cm-foot">Centimeter to Foot</option>
        <option value="meter">Meter to Yard</option>
        <option value="km">Kilometer to Mile</option>
    </select>

    <button id="convert">Convert</button>

    <p id="result"></p>
        </div>
    </div>
</body>
</html>
