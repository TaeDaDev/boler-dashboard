<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Interactive Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/script.js"></script>

    <!-- Bootstrap  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1>My Interactive Dashboard</h1>
    <p>
      This dashboard was created by Asante Boler for the WEB-115 course at Wake
      Tech
    </p>

    <script>
      document.write(
        "This dashboard demonstrates how JavaScript can be used to create interactive websites.",
      );
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript
      >Unfortunately, your web browser does not support JavaScript.</noscript
    >

    <div class="container">
      <div class="row">
        <!-- Dashboard Content -->
        <div class="col" id="magic-eight-ball">
          <script src="magic-eight-ball.js" defer></script>
          ﻿
          <link rel="stylesheet" href="css/magic-eight-ball.css" />
          <h2 class="heading">Magic Eight Ball</h2>
          <form>
            <p>
              Type a yes/no question below, then click on the Eight Ball below
              to get your answer!
            </p>
            <input id="question" name="question" size="80" />
            <div id="magicEightBall">
              <div id="circle"></div>
              <img id="ball" src="img/magic-eight-ball.png" />
            </div>
            <button id="reset" name="reset" type="reset">
              Ask another question
            </button>
            <button id="addAnswer">Add Answer</button>
          </form>
          <br />
        </div>
      </div>
    </div>
  </body>
</html>
